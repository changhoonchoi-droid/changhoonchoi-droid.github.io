<title>🔒 유튜브 요약 — 발행 전 미리보기</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1320;color:#e8ebf2;
font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif}
.box{width:min(380px,90vw);padding:28px;border-radius:18px;background:#181d2c;box-shadow:0 10px 40px rgba(0,0,0,.4)}
h1{font-size:20px;margin:0 0 4px}p{color:#9aa3b5;font-size:14px;margin:0 0 16px}
input[type=password]{width:100%;box-sizing:border-box;font-size:17px;padding:12px 14px;border-radius:10px;border:1px solid #2c3449;background:#0f1320;color:#fff}
button{width:100%;margin-top:10px;font-size:16px;font-weight:700;padding:12px;border:0;border-radius:10px;background:#5b7cff;color:#fff;cursor:pointer}
label{display:flex;gap:6px;align-items:center;font-size:13px;color:#9aa3b5;margin-top:12px}#e{color:#ff7b8a;min-height:18px;margin:10px 0 0}
#w{display:none;color:#9aa3b5;font-size:14px}</style></head>
<body><div class="box" id="g"><h1>🔒 개인 리포트</h1><p>유튜브 요약 — 발행 전 미리보기</p>
<form id="f"><input id="p" type="password" placeholder="암호" autocomplete="current-password" autofocus><button>열기</button></form>
<label><input type="checkbox" id="r" checked> 이 기기에서 암호 기억</label><p id="e"></p></div>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.salt),iterations:D.it,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.iv)},key,b(D.ct)));}
async function fresh(){try{const r=await fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"});

async function go(pw,remember,auto){document.getElementById("w").style.display="block";
try{await fresh();const h=await dec(pw);try{if(remember)localStorage.setItem("hub-pw",pw);}catch(_){}
const hash=location.hash;document.open();document.write(h);document.close();if(hash)setTimeout(()=>{location.hash="";location.hash=hash},50);}
catch(err){document.getElementById("w").style.display="none";try{localStorage.removeItem("hub-pw")}catch(_){}
if(!auto)document.getElementById("e").textContent="암호가 맞지 않습니다";}}
document.getElementById("f").onsubmit=ev=>{ev.preventDefault();go(document.getElementById("p").value,document.getElementById("r").checked,false)};
let s=null;try{s=localStorage.getItem("hub-pw")}catch(_){}if(s)go(s,true,true);
